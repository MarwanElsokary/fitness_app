name: Firebase App Distribution

on:
  push:
    branches:
      - main
      - master
      - development
      - dev
  pull_request:
    branches:
      - main
      - master
      - development
      - dev

jobs:
  android-build:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate files
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Android Debug APK
        run: flutter build apk --debug

      # 🔐 إعداد مفتاح Firebase من الـ Secret
      - name: Setup Firebase authentication
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/firebase-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-key.json"
          echo "✅ Firebase service account key configured."

      # 🔧 تثبيت Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ✅ تأكيد الاتصال بـ Firebase
      - name: Verify Firebase Authentication
        run: firebase projects:list

      # 🚀 رفع الـ APK إلى Firebase App Distribution
      - name: Upload Android APK to Firebase App Distribution
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-debug.apk \
            --app ${{ secrets.FIREBASE_APP_ID_ANDROID_DEV }} \
            --groups "Android-team" \
            --release-notes "🔥 Android Debug Build | Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"
