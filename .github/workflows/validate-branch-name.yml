# .github/workflows/validate-branch-name.yml
name: Validate Branch Name

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-branch:
    name: Validate Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Validate Branch Name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" || "$BRANCH_NAME" == "development" || "$BRANCH_NAME" == "dev" ]]; then
            echo "✅ Branch '${BRANCH_NAME}' is exempt from validation."
            exit 0
          fi

          BRANCH_REGEX='^(feature|hotfix|bugfix|release)\/[A-Z]+-[0-9]+.*$'
          if [[ ! "$BRANCH_NAME" =~ $BRANCH_REGEX ]]; then
            echo "❌ Invalid branch name: '${BRANCH_NAME}'"
            echo "Must match: feature/PROJECT-123-description"
            exit 1
          fi

          echo "✅ Branch name '${BRANCH_NAME}' is valid."
